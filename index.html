    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('portfolio_theme');
          // Default is LIGHT mode unless user explicitly selected dark
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
